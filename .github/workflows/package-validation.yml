name: Package validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-validation:
    name: Package validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install minimum supported rclone
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/rclone.zip" \
            https://github.com/rclone/rclone/releases/download/v1.71.0/rclone-v1.71.0-linux-amd64.zip
          printf '%s  %s\n' '3ddbcfd535ef2e6eb00cd006831766537f1fef1c8baeed1ee4632e7bcc699e93' "$RUNNER_TEMP/rclone.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/rclone-v1.71.0-linux-amd64" >> "$GITHUB_PATH"
      - name: Install desktop package validators
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libglib2.0-bin desktop-file-utils
      - name: Validate package and behavior
        shell: bash
        run: |
          set -euo pipefail
          bash -n gdrive-sync.sh install.sh uninstall.sh
          python3 -m unittest discover -s tests -v
          python3 - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree

          ElementTree.parse('icons/icon-gdrive-sync.svg')
          json.loads(Path('examples/config.json').read_text())
          for path in Path('.github/rulesets').glob('*.json'):
              json.loads(path.read_text())
          PY
